name: Problema
description: Algo falha ao instalar ou ao usar a extensão.
title: "[Problema] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Antes, confira a seção [Não está funcionando?](https://github.com/git-jr/WA-audio-stickers#não-está-funcionando) do README e veja se alguém já reportou nos [issues existentes](https://github.com/git-jr/WA-audio-stickers/issues?q=is%3Aissue).
        **Não funciona no Firefox** nem em navegadores baseados nele.
        Se quem recebeu a figurinha vê «Você recebeu uma mensagem que não é compatível com a sua versão do WhatsApp», essa pessoa precisa atualizar o WhatsApp: não é um erro da extensão.
  - type: dropdown
    id: etapa
    attributes:
      label: Quando acontece?
      options:
        - Ao instalar (página de extensões)
        - Ao abrir o painel no WhatsApp Web
        - Ao calcular as opções ou criar a figurinha
        - Ao enviar a figurinha
        - A figurinha chega, mas sem som ou com problema de imagem
        - Outro
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e versão
      description: "Por exemplo: Chrome 142, Edge 141, Brave 1.85. A versão fica em Menu → Ajuda → Sobre."
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options:
        - Windows
        - macOS
        - Linux
        - Outro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão da extensão
      description: Aparece no topo do painel ("Versão 0.7.2"). Se não for possível abri-lo, use a da página de extensões.
    validations:
      required: true
  - type: textarea
    id: que-paso
    attributes:
      label: O que aconteceu?
      description: O que você fez, o que esperava e o que aconteceu em vez disso. Você pode colar capturas de tela aqui; cubra conversas e números.
    validations:
      required: true
  - type: textarea
    id: registro
    attributes:
      label: Registro de diagnóstico
      description: |
        Se o problema acontece ao usar a extensão: no painel, abra **Ferramentas de teste**, clique em **Diagnóstico**, repita o que falhou e clique em **Salvar registro…**. Arraste o arquivo `.json` para cá (se não for aceito, compacte-o em um ZIP).
        O registro oculta os números de telefone e não inclui mensagens, mas inclui os nomes dos seus arquivos e o da conversa para a qual você enviou a figurinha: abra-o em um editor de texto e apague o que não quiser compartilhar.
  - type: checkboxes
    id: revisado
    attributes:
      label: Antes de enviar
      options:
        - label: Conferi a seção «Não está funcionando?» do README.
          required: true
        - label: Uso a versão mais recente da extensão.
