<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Figurinhas com som: registro</title>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 16px; font: 13px system-ui, "Segoe UI", sans-serif; background: #fff; color: #111b21; }
    @media (prefers-color-scheme: dark) { body { background: #111b21; color: #e9edef; } #log { background: #202c33 !important; } }
    h1 { font-size: 15px; margin: 0 0 6px; }
    .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    button { padding: 6px 12px; border-radius: 14px; border: 1px solid #8696a0; background: transparent; color: inherit; cursor: pointer; }
    button.main { background: #00a884; color: #fff; border: none; }
    #summary { font-size: 12px; }
    #log { height: calc(100vh - 150px); overflow: auto; font: 11px/1.35 ui-monospace, Consolas, monospace; background: #f0f2f5; padding: 6px; border-radius: 6px; white-space: pre-wrap; }
    .e { color: #d13b3b; } .w { color: #b7791f; }
  </style>
</head>
<body>
  <h1>Figurinhas com som: registro</h1>
  <div style="font-size:12px;margin-bottom:6px">Se algo falhar, baixe o registro e compartilhe com quem lhe passou a extensão. Os números de telefone aparecem ocultos.</div>
  <div id="summary">Carregando…</div>
  <div class="row">
    <button class="main" id="dl">Baixar registro (.json)</button>
    <button id="copy">Copiar</button>
    <button id="errors">Só erros</button>
    <button id="clear">Apagar registro</button>
  </div>
  <div id="log"></div>
  <script src="registro.js"></script>
</body>
</html>
